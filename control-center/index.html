<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimoNote Control Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部标题栏 -->
        <header class="app-header">
            <h1>🎵 AnimoNote <span class="subtitle">Control Center</span></h1>
            <div class="header-actions">
                <button id="btn-scan" class="btn btn-secondary" onclick="scanModels()">🔄 刷新</button>
                <button id="btn-start-all" class="btn btn-primary" onclick="startAll()">▶ 全部启动</button>
                <button id="btn-stop-all" class="btn btn-danger" onclick="stopAll()">■ 全部停止</button>
            </div>
        </header>

        <div class="main-content">
            <!-- 左侧：角色列表 -->
            <aside class="sidebar">
                <section class="panel model-list-panel">
                    <div class="panel-header">
                        <h2>🎭 角色</h2>
                        <button class="btn btn-small btn-secondary" onclick="showNewModelDialog()" title="新建角色">➕</button>
                    </div>
                    <div class="panel-body" id="model-list">
                        <div class="model-list-empty">点击「刷新」扫描 models/</div>
                    </div>
                </section>
            </aside>

            <!-- 右侧：主内容区 -->
            <main class="content">
                <!-- 选项卡导航 -->
                <div class="tab-bar">
                    <button class="tab-btn active" data-tab="instances" onclick="switchTab('instances')">📋 实例</button>
                    <button class="tab-btn" data-tab="config" onclick="switchTab('config')">⚙️ 角色配置</button>
                    <button class="tab-btn" data-tab="mapping" onclick="switchTab('mapping')">🎼 映射</button>
                </div>

                <!-- 选项卡：实例管理 -->
                <div class="tab-content active" id="tab-instances">
                    <section class="panel instances-panel">
                        <h2>运行实例</h2>
                        <div class="panel-body">
                            <table class="instances-table" id="instances-table">
                                <thead>
                                    <tr>
                                        <th>角色</th>
                                        <th>通道</th>
                                        <th>状态</th>
                                        <th>PID</th>
                                        <th>LCD 状态屏</th>
                                        <th>映射</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="instances-tbody">
                                    <tr class="empty-row"><td colspan="7">点击「刷新」扫描 models/ 目录...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>

                <!-- 选项卡：角色配置 -->
                <div class="tab-content" id="tab-config">
                    <section class="panel config-editor-panel">
                        <div class="config-header">
                            <h2>⚙️ 角色配置</h2>
                            <div class="config-header-actions">
                                <span id="config-model-name" class="config-model-label">— 未选择 —</span>
                                <button class="btn btn-primary btn-small" onclick="saveConfig()">💾 保存配置</button>
                            </div>
                        </div>
                        <div class="panel-body" id="config-editor-body">
                            <div class="config-empty">👈 在左侧角色列表中点击一个角色开始编辑</div>
                        </div>
                    </section>
                </div>

                <!-- 选项卡：映射编辑器 -->
                <div class="tab-content" id="tab-mapping">
                    <section class="panel mapping-editor-panel">
                        <div class="mapping-header">
                            <h2>🎼 音符→VMD 映射</h2>
                            <div class="mapping-header-actions">
                                <span id="mapping-model-name" class="mapping-model-label">— 未选择 —</span>
                                <button class="btn btn-secondary btn-small" onclick="addMappingRow()">➕ 添加</button>
                                <button class="btn btn-primary btn-small" onclick="saveMapping()">💾 保存</button>
                            </div>
                        </div>
                        <div class="panel-body">
                            <div class="mapping-toolbar">
                                <span style="color:var(--text-secondary);font-size:12px;">快速添加：</span>
                                <select id="quick-note-select" class="mapping-select"><option value="">选择音符...</option></select>
                                <select id="quick-vmd-select" class="mapping-select"><option value="">选择 VMD...</option></select>
                                <button class="btn btn-small btn-start" onclick="quickAddMapping()">➕ 快速添加</button>
                            </div>
                            <div class="mapping-table-container" id="mapping-table-container">
                                <div class="mapping-empty">👈 在左侧角色列表中点击一个角色</div>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- 日志 -->
                <section class="panel log-panel">
                    <h2>📝 日志</h2>
                    <div class="panel-body">
                        <div class="log-container" id="log-container">
                            <div class="log-entry log-info">[系统] AnimoNote Control Center 已启动</div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- 新建角色对话框 -->
    <div class="modal-overlay hidden" id="new-model-modal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3>➕ 新建角色</h3>
                <button class="btn-icon" onclick="closeNewModelDialog()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>角色 ID（目录名，英文）</label>
                    <input type="text" id="new-model-id" class="form-input" placeholder="例如: miku" pattern="[a-z0-9-]+">
                </div>
                <div class="form-group">
                    <label>显示名称</label>
                    <input type="text" id="new-model-name" class="form-input" placeholder="例如: 初音未来">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeNewModelDialog()">取消</button>
                <button class="btn btn-primary" onclick="createNewModel()">创建</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
